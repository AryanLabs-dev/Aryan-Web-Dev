<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms & input Tags - AryanLabs</title>
</head>

<body>
    <h1>forms for Applying Engineers in AryanLabs</h1>
    <form action="https://www.google.com" method="post">
        <div>
            <label for="username">Enter Your Username - </label>
            <input type="text" name="Username" id="username" placeholder=" Enter Your Name">
            <br>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female">
        </div>
        <div>
            <label for="Box">Subscribe for Newsletter</label>
            <input type="checkbox" name="Check" id="Box">
        </div>
        <div>
            <Select name="Fruits">
                <option value="Apple">Apple</option>
                <option value="Banana">Banana</option>
                <option value="Cherry">Cherry</option>
                <option value="Litchi">Litchi</option>
            </Select>
        </div>
        <div>
            <label for="Textarea"></label>
            <textarea name="Textarea" id="Textarea" cols="35" rows="7"
                placeholder=" Enter Your Comment here"></textarea>
        </div>
        <input type="submit">
    </form>
</body>

</html>
