<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aryan's Hacking Simulator by Arynalabs</title>

    <style>
        body {
            background: black;
            color: #00ff00;
            font-family: monospace;
            padding: 20px;
            font-size: 20px;
        }

        .dots::after {
            content: "";
            animation: blink 1.5s steps(4, end) infinite;
        }

        @keyframes blink {
            0% {
                content: "";
            }

            25% {
                content: ".";
            }

            50% {
                content: "..";
            }

            75% {
                content: "...";
            }

            100% {
                content: "";
            }
        }
    </style>
</head>

<body>
    <h2>Aryan's Hacking Simulator<span class="dots"></span></h2>
    <div id="logs"></div>

    <script src="script.js"></script>
</body>

</html>
