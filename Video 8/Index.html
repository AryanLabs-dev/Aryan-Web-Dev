<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz of Forms by AryanLabs</title>
</head>
<body>
    <h3>Q. Create a form which ask about a man of her Name,City and Pincode</h3>
    <form action="post">
        <label for="Username"></label>
        <input type="text" id="Username" name="Username" placeholder=" Enter Your Name ">
        <label for="City"></label>
        <input type="text" name="City" id="City" placeholder=" Enter Your City Name">
        <label for="Pincode"></label>
        <input type="Pincode" name="Pincode" id="Pincode" maxlength="6" placeholder=" e.g. 272175" required >
        <input type="submit" value="Submit">
    </form>
</body>
</html>
