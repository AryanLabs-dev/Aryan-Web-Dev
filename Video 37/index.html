<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6 Design the Nav bar with the help of Flexbox by Aryan Labs</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');


    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 15px 40px;
    }


    .logo img {
        width: 150px;
        height: auto;
        display: block;
    }

    ul {
        display: flex;
        list-style: none;
        gap: 30px;
    }

    li {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-family: "Poppins", sans-serif;
    }

    li>img {
        width: 20px;
    }

    main>h2,
    h4 {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    h2 {
        font-weight: normal;
        font-family: "Poppins", sans-serif;
    }

    h4 {
        font-weight: normal;
        color: rgb(72, 72, 72);
        display: flex;
    }
</style>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="proj.img.png" alt="">
            </div>
            <ul>
                <li> <img class=".svg" src="My.svg" alt="1.svg">Products</li>
                <li> <img class=".svg" src="My2.svg" alt="2.svg">Pricing</li>
                <li> <img class=".svg" src="My3.svg" alt="3.svg">Resources</li>
                <li> <img class=".svg" src="My4.svg" alt="4.svg">About us</li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Download for Windows</h2>
        <h4>Download and try UltraEdit before you buy it! This download includes the full Windows version of the text
            editor.</h4>
    </main>
</body>

</html>
